<!DOCTYPE html>
<html lang="uk">
<head><meta charset="utf-8"><title>TikTok auth — film2shorts</title></head>
<body style="font-family:sans-serif;max-width:600px;margin:40px auto;text-align:center">
<h1>✅ TikTok підключено</h1>
<p>Скопіюй код нижче і встав його в термінал, де запущено <b>tiktok_auth.py</b>:</p>
<p id="code" style="font-family:monospace;font-size:22px;background:#f0f0f0;
   padding:16px;word-break:break-all;user-select:all">очікую…</p>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').innerText)">
  Копіювати код
</button>
<script>
  var m = new URLSearchParams(location.search);
  var c = m.get('code');
  document.getElementById('code').innerText = c ? c : 'немає ?code= в адресі — щось пішло не так';
</script>
</body>
</html>
